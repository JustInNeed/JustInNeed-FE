name: visual-diff

# 정책 #25 화면 비교 기록: 화면 파일이 바뀐 PR 마다 main 코드와 PR 코드로 주요 페이지를 찍어 비교한다.
# BE 없이 Playwright 가 API 요청을 가로채 고정 데이터(src/test/fixtures)로 답한다 (visual/mockApi.ts).
# 결과는 PR 댓글(하나를 고쳐 씀)과 CI 결과물 visual-diff 로 남긴다. 기록용이라 필수 검사가 아니며 머지를 막지 않는다.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/**/*.tsx"
      - "src/**/*.css"
      - "visual/**"
      - "playwright.visual.config.ts"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: visual-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-diff:
    if: github.repository == 'JustInNeed/JustInNeed-FE'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            head/package-lock.json
            base/package-lock.json

      - name: Install (PR)
        working-directory: head
        run: npm ci

      - name: Install browser
        working-directory: head
        run: npx playwright install --with-deps chromium

      # 촬영 도구(visual/)는 두 쪽 모두 PR 의 것을 쓴다. 도구가 같아야 차이가 앱 코드에서만 나온다
      - name: Install (main) with PR's visual tools
        working-directory: base
        run: |
          npm ci
          rm -r -f visual
          cp -r ../head/visual ./visual
          cp ../head/playwright.visual.config.ts ./playwright.visual.config.ts
          npm install --no-save "@playwright/test@$(node -p "require('../head/package.json').devDependencies['@playwright/test']")" pixelmatch pngjs

      - name: Shoot main
        working-directory: base
        run: |
          npx next build
          VISUAL_OUT=$GITHUB_WORKSPACE/out/base npx playwright test -c playwright.visual.config.ts

      - name: Shoot PR
        working-directory: head
        run: |
          npx next build
          VISUAL_OUT=$GITHUB_WORKSPACE/out/head npx playwright test -c playwright.visual.config.ts

      - name: Compare
        working-directory: head
        run: node visual/compare.mjs "$GITHUB_WORKSPACE/out/base" "$GITHUB_WORKSPACE/out/head" "$GITHUB_WORKSPACE/out/diff"

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: |
            out/diff
            out/head
          retention-days: 14

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- visual-diff -->";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = fs.readFileSync("out/diff/summary.md", "utf8") + `\n[이미지 내려받기 (CI 결과물 visual-diff)](${run})\n`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const mine = comments.find((c) => c.user.type === "Bot" && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
